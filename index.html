<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tenerife 24/7 - Portal & Exclusive Directory</title>
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #008380;
            --primary-dark: #005654;
            --accent: #ff6b6b;
            --secondary: #f4f7f6;
            --dark: #1a252c;
            --light: #ffffff;
            --gray: #6c757d;
            --border: #e2e8f0;
            --radius: 12px;
            --shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--secondary);
            color: var(--dark);
            line-height: 1.6;
        }

        /* Paywall / Membership Overlay */
        #membership-gate {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(26, 37, 44, 0.95);
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .gate-card {
            background: var(--light);
            max-width: 500px;
            width: 100%;
            padding: 30px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            text-align: center;
        }

        .gate-card h2 {
            color: var(--primary);
            margin-bottom: 15px;
            font-size: 1.8rem;
        }

        .gate-card p {
            color: var(--gray);
            margin-bottom: 25px;
            font-size: 0.95rem;
        }

        .gate-btn {
            background: var(--primary);
            color: var(--light);
            border: none;
            padding: 12px 25px;
            border-radius: var(--radius);
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            margin-bottom: 10px;
            transition: background 0.3s;
        }

        .gate-btn:hover {
            background: var(--primary-dark);
        }

        .gate-btn.secondary {
            background: transparent;
            color: var(--primary);
            border: 2px solid var(--primary);
        }

        .gate-btn.secondary:hover {
            background: var(--secondary);
        }

        /* Header & Navigation */
        header {
            background: var(--light);
            box-shadow: var(--shadow);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .header-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo-group h1 {
            font-size: 1.5rem;
            color: var(--primary);
            font-weight: 800;
        }

        .logo-group .domain-tag {
            font-size: 0.8rem;
            color: var(--gray);
        }

        .auth-bar {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .user-badge {
            background: var(--secondary);
            padding: 0.4rem 0.8rem;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        /* Hero Section */
        .hero {
            background: linear-gradient(135deg, rgba(0, 131, 128, 0.9), rgba(0, 86, 84, 0.95)), url('https://images.unsplash.com/photo-1589182337358-2fabd1205ac6?auto=format&fit=crop&w=1200&q=80');
            background-size: cover;
            background-position: center;
            color: var(--light);
            text-align: center;
            padding: 4rem 1rem;
        }

        .hero h2 {
            font-size: 2.2rem;
            margin-bottom: 1rem;
        }

        .hero p {
            max-width: 700px;
            margin: 0 auto 2rem auto;
            font-size: 1.1rem;
            opacity: 0.9;
        }

        /* Scrolling Ticker / Marquee Bar */
        .ticker-container {
            background: var(--accent);
            color: var(--light);
            overflow: hidden;
            white-space: nowrap;
            padding: 10px 0;
            font-weight: 600;
            font-size: 0.9rem;
        }

        .ticker-text {
            display: inline-block;
            animation: marquee 25s linear infinite;
        }

        @keyframes marquee {
            0% { transform: translate3d(100%, 0, 0); }
            100% { transform: translate3d(-100%, 0, 0); }
        }

        /* Main Content Layout */
        main {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        .section-title {
            font-size: 1.5rem;
            color: var(--dark);
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            gap: 10px;
            border-bottom: 2px solid var(--border);
            padding-bottom: 0.5rem;
        }

        /* Districts Filter Bar */
        .district-filter {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding-bottom: 1rem
