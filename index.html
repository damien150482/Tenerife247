<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tenerife 24/7 - Portail & Annuaire Exclusif</title>
    <!-- FontAwesome pour les icônes -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #008380;
            --primary-dark: #005654;
            --accent: #ff6b6b;
            --secondary: #f4f7f6;
            --dark: #1a252c;
            --light: #ffffff;
            --gray: #6c757d;
            --border: #e2e8f0;
            --radius: 12px;
            --shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--secondary);
            color: var(--dark);
            line-height: 1.6;
        }

        /* Portail / Paywall d'accès obligatoire */
        #membership-gate {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(26, 37, 44, 0.95);
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .gate-card {
            background: var(--light);
            max-width: 500px;
            width: 100%;
            padding: 30px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            text-align: center;
        }

        .gate-card h2 {
            color: var(--primary);
            margin-bottom: 15px;
            font-size: 1.8rem;
        }

        .gate-card p {
            color: var(--gray);
            margin-bottom: 25px;
            font-size: 0.95rem;
        }

        .gate-btn {
            background: var(--primary);
            color: var(--light);
            border: none;
            padding: 12px 25px;
            border-radius: var(--radius);
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            margin-bottom: 10px;
            transition: background 0.3s;
            text-decoration: none;
            display: inline-block;
        }

        .gate-btn:hover {
            background: var(--primary-dark);
        }

        .gate-btn.secondary {
            background: transparent;
            color: var(--primary);
            border: 2px solid var(--primary);
        }

        .gate-btn.secondary:hover {
            background: var(--secondary);
        }

        .gate-btn.stripe-btn {
            background: #635bff;
        }
        .gate-btn.stripe-btn:hover {
            background: #4b42db;
        }

        /* En-tête & Navigation */
        header {
            background: var(--light);
            box-shadow: var(--shadow);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .header-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo-group h1 {
            font-size: 1.5rem;
            color: var(--primary);
            font-weight: 800;
        }

        .logo-group .domain-tag {
            font-size: 0.8rem;
            color: var(--gray);
        }

        .auth-bar {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .user-badge {
            background: var(--secondary);
            padding: 0.4rem 0.8rem;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        /* Section Héroïque */
        .hero {
            background: linear-gradient(135deg, rgba(0, 131, 128, 0.9), rgba(0, 86, 84, 0.95)), url('https://images.unsplash.com/photo-1589182337358-2fabd1205ac6?auto=format&fit=crop&w=1200&q=80');
            background-size: cover;
            background-position: center;
            color: var(--light);
            text-align: center;
            padding: 4rem 1rem;
        }

        .hero h2 {
            font-size: 2.2rem;
            margin-bottom: 1rem;
        }

        .hero p {
            max-width: 700px;
            margin: 0 auto 2rem auto;
            font-size: 1.1rem;
            opacity: 0.9;
        }

        /* Barre de Défilement (Ticker) */
        .ticker-container {
            background: var(--accent);
            color: var(--light);
            overflow: hidden;
            white-space: nowrap;
            padding: 10px 0;
            font-weight: 600;
            font-size: 0.9rem;
        }

        .ticker-text {
            display: inline-block;
            animation: marquee 25s linear infinite;
        }

        @keyframes marquee {
            0% { transform: translate3d(100%, 0, 0); }
            100% { transform: translate3d(-100%, 0, 0); }
        }

        /* Contenu Principal */
        main {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        .section-title {
            font-size: 1.5rem;
            color: var(--dark);
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            gap: 10px;
            border-bottom: 2px solid var(--border);
            padding-bottom: 0.5rem;
        }

        /* Filtres par Districts */
        .district-filter {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding-bottom: 1rem;
            margin-bottom: 2rem;
        }

        .district-btn {
            background: var(--light);
            border: 1px solid var(--border);
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            white-space: nowrap;
            font-weight: 600;
            color: var(--dark);
            transition: all 0.3s;
        }

        .district-btn.active, .district-btn:hover {
            background: var(--primary);
            color: var(--light);
            border-color: var(--primary);
        }

        /* Structure des Accordéons */
        .accordion-group {
            margin-bottom: 2rem;
        }

        .accordion-item {
            background: var(--light);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            margin-bottom: 10px;
            overflow: hidden;
            box-shadow: 0 2px 5px rgba(0,0,0,0.02);
        }

        .accordion-header {
            padding: 1rem 1.25rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            background: var(--light);
            font-weight: 600;
            font-size: 1.05rem;
            color: var(--dark);
            transition: background 0.2s;
        }

        .accordion-header:hover {
            background: var(--secondary);
        }

        .accordion-header i.fa-chevron-down {
            transition: transform 0.3s;
        }

        .accordion-item.active .accordion-header i.fa-chevron-down {
            transform: rotate(180deg);
        }

        .accordion-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease-out;
            background: var(--light);
            padding: 0 1.25rem;
        }

        .accordion-item.active .accordion-content {
            max-height: 2000px;
            padding: 1rem 1.25rem 1.25rem 1.25rem;
            border-top: 1px solid var(--border);
        }

        /* Grille des Fiches Professionnelles */
        .directory-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 15px;
            margin-top: 10px;
        }

        .directory-card {
            background: var(--secondary);
            border: 1px solid var(--border);
            padding: 15px;
            border-radius: 8px;
            border-left: 4px solid var(--primary);
        }

        .directory-card h4 {
            color: var(--primary);
            margin-bottom: 5px;
            font-size: 1rem;
        }

        .directory-card p {
            font-size: 0.85rem;
            color: var(--gray);
            margin-bottom: 6px;
        }

        .directory-card a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
        }

        .directory-card a:hover {
            text-decoration: underline;
        }

        .badge-tag {
            display: inline-block;
            background: #e6f2f2;
            color: var(--primary);
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 600;
            margin-top: 5px;
        }

        /* Encadré Inscription Pro */
        .pro-info-box {
            background: var(--secondary);
            padding: 25px;
            border-radius: var(--radius);
            margin-top: 15px;
            border: 1px solid var(--border);
            text-align: center;
        }

        .pro-info-box h4 {
            color: var(--primary);
            margin-bottom: 10px;
            font-size: 1.3rem;
        }

        .pro-info-box p {
            color: var(--gray);
            margin-bottom: 20px;
            font-size: 0.95rem;
        }

        /* Pied de page */
        footer {
            background: var(--dark);
            color: var(--light);
            text-align: center;
            padding: 2rem 1rem;
            margin-top: 3rem;
            font-size: 0.9rem;
        }

        footer a {
            color: var(--accent);
            text-decoration: none;
        }
    </style>
</head>
<body>
