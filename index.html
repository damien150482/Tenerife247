<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tenerife 24/7</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root{--primary:#0284c7;--bg-dark:#0f172a;--bg-light:#f8fafc;--border:#e2e8f0;--success:#10b981;--accent:#f59e0b;}
        *{box-sizing:border-box;margin:0;padding:0;font-family:sans-serif;}
        body{background:var(--bg-light);color:#1e293b;line-height:1.5;}
        #gate{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(15,23,42,0.95);z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px;}
        .card{background:#fff;max-width:500px;width:100%;padding:25px;border-radius:12px;text-align:center;}
        .btn{display:block;width:100%;padding:12px;margin:10px 0;background:var(--primary);color:#fff;border:none;border-radius:8px;font-weight:bold;cursor:pointer;}
        .btn-pro{background:var(--success);}
        #wrap{max-width:1000px;margin:20px auto;background:#fff;border-radius:12px;overflow:hidden;border:1px solid var(--border);}
        header{background:var(--bg-dark);color:#fff;padding:20px;text-align:center;}
        .accordion{border-top:1px solid var(--border);}
        .acc-head{width:100%;padding:15px 20px;background:#fff;border:none;text-align:left;font-weight:bold;font-size:16px;cursor:pointer;display:flex;justify-content:space-between;}
        .acc-body{display:none;padding:20px;background:#f8fafc;}
        .acc-item.open .acc-body{display:block;}
        .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:15px;}
        .item-card{background:#fff;border:1px solid var(--border);padding:15px;border-radius:8px;border-left:4px solid var(--primary);}
        .item-card h4{color:var(--primary);margin-bottom:5px;}
        .item-card a{display:inline-block;margin-top:8px;padding:6px 12px;background:var(--primary);color:#fff;border-radius:4px;text-decoration:none;font-size:12px;}
    </style>
</head>
<body>
    <div id="gate">
        <div class="card">
            <h2>Tenerife 24/7</h2>
            <p style="margin:15px 0;color:#64748b;">Sélectionnez votre profil d'accès :</p>
            <button class="btn" onclick="document.getElementById('gate').style.display='none'">Accès Touriste / Particulier</button>
            <button class="btn btn-pro" onclick="document.getElementById('gate').style.display='none'">Accès Professionnels</button>
        </div>
    </div>

    <div id="wrap">
        <header>
            <h1>Tenerife 24/7 - Annuaire Officiel</h1>
            <p style="font-size:13px;color:#94a3b8;margin-top:5px;">damien150482.github.io/Tenerife247</p>
        </header>

        <div class="accordion">
            <div class="acc-item open">
                <button class="acc-head" onclick="this.parentElement.classList.toggle('open')"><span>1. Hébergements & Vanlife</span><i class="fa-solid fa-chevron-down"></i></button>
                <div class="acc-body" style="display:block;">
                    <div class="grid">
                        <div class="item-card">
                            <h4>Hotel Playa Sur Tenerife</h4>
                            <p>El Médano, Granadilla</p>
                            <a href="https://www.google.com/maps/search/?api=1&query=Hotel+Playa+Sur+Tenerife" target="_blank">GPS Maps</a>
                        </div>
                    </div>
                </div>
            </div>

            <div class="acc-item">
                <button class="acc-head" onclick="this.parentElement.classList.toggle('open')"><span>2. Restaurants & Guachinches</span><i class="fa-solid fa-chevron-down"></i></button>
                <div class="acc-body">
                    <div class="grid">
                        <div class="item-card">
                            <h4>Guachinche El Cordero</h4>
                            <p>Chayofa, Arona</p>
                            <a href="https://www.google.com/maps/search/?api=1&query=Guachinche+El+Cordero+Tenerife" target="_blank">GPS Maps</a>
                        </div>
                    </div>
                </div>
            </div>

            <div class="acc-item">
                <button class="acc-head" onclick="this.parentElement.classList.toggle('open')"><span>3. Espace Pro & Partenaires</span><i class="fa-solid fa-chevron-down"></i></button>
                <div class="acc-body">
                    <div class="grid">
                        <div class="item-card" style="border-left-color:var(--success);">
                            <h4>Contact Partenaire</h4>
                            <p>Rejoignez l'annuaire officiel.</p>
                            <a href="https://wa.me/33615327287" target="_blank" style="background:var(--success);">WhatsApp Direct</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
