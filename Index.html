<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tenerife 24/7 - Portails & Répertoire Exclusif</title>
    <!-- FontAwesome pour les icônes -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #008080;
            --primary-dark: #005959;
            --accent: #ff6b6b;
            --secondary: #f4f7f6;
            --dark: #1a252c;
            --light: #ffffff;
            --gray: #6c757d;
            --border: #e2e8f0;
            --radius: 12px;
            --shadow: 0 4px 20px rgba(0,0,0,0.08);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--secondary);
            color: var(--dark);
            line-height: 1.6;
        }

        /* Top Bar & Header */
        header {
            background: var(--light);
            box-shadow: var(--shadow);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .header-container {
            max-width: 1300px;
            margin: 0 auto;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo-group {
            display: flex;
            flex-direction: column;
        }

        .logo-group h1 {
            font-size: 1.8rem;
            color: var(--primary);
            font-weight: 800;
        }

        .logo-group .domain-tag {
            font-size: 0.8rem;
            color: var(--gray);
        }

        .auth-bar {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .user-badge {
            padding: 0.4rem 0.8rem;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            background: #e2e8f0;
        }

        .timer-badge {
            background: #fff3cd;
            color: #856404;
            padding: 0.4rem 0.8rem;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: bold;
            display: none;
        }

        /* Hero Banner */
        .hero {
            background: linear-gradient(135deg, rgba(0,128,128,0.9), rgba(26,37,44,0.9)), url('https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=1400&q=80') center/cover;
            color: var(--light);
            text-align: center;
            padding: 4rem 1rem;
        }

        .hero h2 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
        }

        .hero p {
            max-width: 800px;
            margin: 0 auto 2rem;
            font-size: 1.1rem;
            opacity: 0.95;
        }

        .cta-group {
            display: flex;
            justify-content: center;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .btn {
            padding: 0.8rem 1.8rem;
            border-radius: 30px;
            border: none;
            cursor: pointer;
            font-weight: 700;
            font-size: 1rem;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn-primary {
            background: var(--accent);
            color: var(--light);
        }

        .btn-primary:hover {
            background: #ff5252;
            transform: translateY(-2px);
        }

        .btn-outline {
            background: transparent;
            color: var(--light);
            border: 2px solid var(--light);
        }

        .btn-outline:hover {
            background: var(--light);
            color: var(--primary);
        }

        /* Layout Main */
        .container {
            max-width: 1300px;
            margin: 2rem auto;
            padding: 0 1.5rem;
        }

        /* Paywall Modal / Overlay */
        .paywall-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(8px);
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1rem;
        }

        .paywall-card {
            background: var(--light);
            border-radius: var(--radius);
            max-width: 900px;
            width: 100%;
            padding: 2.5rem;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            text-align: center;
            max-height: 90vh;
            overflow-y: auto;
        }

        .pricing-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1.5rem;
            margin: 2rem 0;
        }

        .price-box {
            border: 2px solid var(--border);
            border-radius: var(--radius);
            padding: 1.5rem;
            transition: transform 0.3s ease;
            background: var(--light);
            position: relative;
        }

        .price-box.featured {
            border-color: var(--primary);
            box-shadow: var(--shadow);
        }

        .price-box h3 {
            color: var(--primary);
            margin-bottom: 0.5rem;
        }

        .price-box .price {
            font-size: 2rem;
            font-weight: 800;
            margin: 1rem 0;
        }

        .price-box ul {
            list-style: none;
            text-align: left;
            margin-bottom: 1.5rem;
            font-size: 0.9rem;
        }

        .price-box ul li {
            margin-bottom: 0.5rem;
        }

        /* Tabs Navigation for Directory */
        .zone-nav {
            display: flex;
            gap: 0.5rem;
            overflow-x: auto;
            padding-bottom: 1rem;
            margin-bottom: 1.5rem;
        }

        .zone-btn {
            padding: 0.5rem 1.2rem;
            background: var(--light);
            border: 1px solid var(--border);
            border-radius: 20px;
            cursor: pointer;
            white-space: nowrap;
            font-weight: 600;
        }

        .zone-btn.active {
            background: var(--primary);
            color: var(--light);
            border-color: var(--primary);
        }

        /* Accordion Structure */
        .accordion-item {
            background: var(--light);
            border-radius: var(--radius);
            margin-bottom: 1.2rem;
            box-shadow: var(--shadow);
            overflow: hidden;
            border: 1px solid var(--border);
        }

        .accordion-header {
            padding: 1.2rem 1.5rem;
            background: var(--light);
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 700;
            font-size: 1.2rem;
            color: var(--primary-dark);
            transition: background 0.2s;
        }

        .accordion-header:hover {
            background: #f8fafc;
        }

        .accordion-header i.chevron {
            transition: transform 0.3s;
        }

        .accordion-item.active .accordion-header i.chevron {
            transform: rotate(180deg);
        }

            display: none;
            padding: 1.5rem;
